default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: <%= ENV.fetch("DB_PASSWORD") { "12345678" } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: 3306

development:
  <<: *default
  database: acme_salary_development

test:
  <<: *default
  database: acme_salary_test

production:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("TIDB_HOST") %>
  port: <%= ENV.fetch("TIDB_PORT", 4000) %>
  username: <%= ENV.fetch("TIDB_USERNAME") %>
  password: <%= ENV.fetch("TIDB_PASSWORD") %>
  database: <%= ENV.fetch("TIDB_DATABASE", "acme_salary_production") %>
  ssl_mode: verify_identity
  sslca: <%= ENV.fetch("TIDB_SSL_CA", "/etc/ssl/cert.pem") %>
  advisory_locks: false
